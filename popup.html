<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 220px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f7f6f4;
      color: #0e0d0b;
      -webkit-font-smoothing: antialiased;
      padding: 16px;
    }

    .popup-label {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: rgba(0,0,0,0.35);
      margin-bottom: 12px;
    }

    .popup-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 11px 14px;
      background: #0e0d0b;
      color: #fff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.02em;
      text-align: left;
      transition: background 0.15s;
    }
    .popup-btn:hover { background: #2a2a2a; }
    .popup-btn svg { flex-shrink: 0; opacity: 0.7; }
  </style>
</head>
<body>
  <p class="popup-label">Virtual Try-On · <a href="https://tryanywear.ai/" target="_blank" rel="noopener noreferrer" style="color:inherit;text-decoration:none;" onmouseover="this.style.textDecoration='underline'" onmouseout="this.style.textDecoration='none'">Anywear</a></p>
  <button class="popup-btn" id="open-widget" style="margin-bottom:8px">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
      stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
      <circle cx="12" cy="13" r="4"/>
    </svg>
    Open fitting room
  </button>
  <button class="popup-btn" id="open-onboarding" style="background:#3a3a3a">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
      stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/>
      <line x1="12" y1="8" x2="12" y2="12"/>
      <line x1="12" y1="16" x2="12.01" y2="16"/>
    </svg>
    Tutorial
  </button>
  <script src="popup.js"></script>
</body>
</html>
